<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d5c70">
<title>Encomendas Padaria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: painel operacional de uma coluna. Dia no topo, placar de status, totais de produção, lista agrupada por faixa de hora. Tipografia condensada vem do canhoto de papel. */
:root{
  --bg:#f1f4f2;
  --surface:#ffffff;
  --surface-2:#e8eeeb;
  --ink:#15201c;
  --ink-2:#4b5c56;
  --line:#d3dbd7;
  --accent:#0d5c70;
  --accent-ink:#ffffff;
  --accent-soft:#d6eaf0;
  --pend-fg:#7a4f00;   --pend-bg:#fbefd0;
  --ready-fg:#0d5c70;  --ready-bg:#d6eaf0;
  --done-fg:#1d6b3a;   --done-bg:#d8f0df;
  --late-fg:#a3251b;   --late-bg:#fbdcd8;
  --s-conf:#7a3b8f;    --s-pad:#8a5a14;    --s-sal:#b0431a;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1714;--surface:#17221e;--surface-2:#1f2d28;--ink:#e8efec;--ink-2:#9db0a9;--line:#2b3b36;
    --accent:#5cc0d8;--accent-ink:#06222b;--accent-soft:#12394404;
    --pend-fg:#f2c768;--pend-bg:#3a2e0f;--ready-fg:#7fd0e4;--ready-bg:#12353f;
    --done-fg:#7fd596;--done-bg:#133323;--late-fg:#ff9b90;--late-bg:#4a1c18;
    --s-conf:#d6a3ea;--s-pad:#e0b567;--s-sal:#f09a73;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1714;--surface:#17221e;--surface-2:#1f2d28;--ink:#e8efec;--ink-2:#9db0a9;--line:#2b3b36;
  --accent:#5cc0d8;--accent-ink:#06222b;--accent-soft:#12394404;
  --pend-fg:#f2c768;--pend-bg:#3a2e0f;--ready-fg:#7fd0e4;--ready-bg:#12353f;
  --done-fg:#7fd596;--done-bg:#133323;--late-fg:#ff9b90;--late-bg:#4a1c18;
  --s-conf:#d6a3ea;--s-pad:#e0b567;--s-sal:#f09a73;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);
  padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:980px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{font:600 .8rem var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:2px 0 0;font:700 2.4rem/1 var(--font-display);letter-spacing:.01em;text-transform:uppercase}
.top-act{display:flex;flex-wrap:wrap;gap:8px}

.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{border-color:var(--accent);filter:brightness(1.08)}
.btn-ghost{background:transparent}
.btn-sm{min-height:36px;padding:0 12px;font-size:.9rem}
.btn-danger{color:var(--late-fg);border-color:var(--late-fg);background:transparent}

.notice{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--pend-bg);color:var(--pend-fg);font-weight:500}

.daynav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}
.daynav .btn{min-width:44px;padding:0 12px}
.daynav input[type=date]{min-height:44px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.daylabel{font:700 1.5rem var(--font-display);text-transform:capitalize;margin-left:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.chip{flex:none;display:flex;gap:8px;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font:700 1rem var(--font-display);font-variant-numeric:tabular-nums}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--pend-fg)}
.chip-empty{color:var(--ink-2);font-size:.9rem;align-self:center}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.stat{background:var(--surface);padding:10px 14px}
.stat b{display:block;font:700 2.1rem/1.05 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font:600 .72rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stat.late b{color:var(--late-fg)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done-fg);transition:width .3s}

.prod{margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.prod h2{margin:0 0 8px;font:600 .8rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.prod ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.prod li{display:flex;gap:6px;align-items:baseline;padding:4px 10px;border-radius:6px;background:var(--surface-2)}
.prod li b{font:700 1.3rem var(--font-display);font-variant-numeric:tabular-nums}
.prod .obs{color:var(--ink-2);font-size:.85rem}
.prod p{margin:0;color:var(--ink-2)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:20px}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.tabs button{min-height:40px;padding:0 14px;border:0;background:transparent;cursor:pointer;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs .n{font:700 1rem var(--font-display);font-variant-numeric:tabular-nums}
#q{flex:1 1 220px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:360px}

.slot{margin-top:18px}
.slot-h{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;font:700 1.6rem var(--font-display)}
.slot-h small{font:500 .9rem var(--font-body);color:var(--ink-2)}
.slot-list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ord{display:grid;grid-template-columns:4.6rem minmax(0,1fr) auto;gap:6px 14px;padding:14px}
.ord+.ord{border-top:1px solid var(--line)}
.ord .time{font:700 1.75rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.ord.late .time{color:var(--late-fg)}
.ord.done .main{opacity:.62}
.who{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.who strong{font-size:1.1rem}
.num{font:600 1rem var(--font-display);letter-spacing:.04em;color:var(--ink-2)}
.tel{color:var(--ink-2);font-variant-numeric:tabular-nums}
.items{list-style:none;margin:6px 0 0;padding:0}
.items li{padding:1px 0}
.items b{font:700 1.15rem var(--font-display);font-variant-numeric:tabular-nums}
.items .obs{color:var(--ink-2);font-size:.9rem}
.pay{margin-top:6px;font-size:.88rem;color:var(--ink-2)}
.pay strong{color:var(--ink)}
.note{margin-top:4px;font-size:.88rem;color:var(--ink-2);font-style:italic}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font:600 .74rem var(--font-body);letter-spacing:.06em;text-transform:uppercase}
.pill.pend{background:var(--pend-bg);color:var(--pend-fg)}
.pill.ready{background:var(--ready-bg);color:var(--ready-fg)}
.pill.done{background:var(--done-bg);color:var(--done-fg)}
.pill.late{background:var(--late-bg);color:var(--late-fg)}
.act{display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:132px}
.act .btn{width:100%}
.linkbtn{background:none;border:0;padding:4px;cursor:pointer;color:var(--ink-2);text-decoration:underline;font-size:.88rem;text-align:center}
.empty{margin-top:18px;padding:28px 18px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font:700 1.4rem var(--font-display);color:var(--ink);margin-bottom:4px}

.ov{position:fixed;inset:0;z-index:20;background:rgba(8,14,12,.6);display:flex;justify-content:center;overflow:auto;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);width:100%;max-width:760px;margin:auto;border-radius:12px;padding:18px 18px 16px}
.sheet h2{margin:0 0 12px;font:700 1.7rem var(--font-display);text-transform:uppercase}
.sheet fieldset{border:0;margin:0 0 14px;padding:0;min-width:0}
.sheet legend{padding:0;margin-bottom:8px;font:600 .78rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld span{font-size:.85rem;color:var(--ink-2)}
.fld input,.fld select,.fld textarea,.irow input,.irow select{width:100%;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.fld textarea{padding:8px 10px;min-height:64px}
.irow{display:grid;grid-template-columns:64px 66px minmax(0,1.4fr) minmax(0,1fr) 138px 40px;gap:8px;margin-bottom:8px;align-items:center}
.irow .i-q{padding:0 8px}
.irow .i-u{padding:0 4px}
.irow .i-s{font-size:14px;padding:0 6px}
.stat.money b{font-size:1.5rem;line-height:1.5}
.irow .i-s.needs{border-color:var(--pend-fg);background:var(--pend-bg)}
.irow.blank .i-s{visibility:hidden}
.irow .rm{min-height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;color:var(--ink-2);font-size:1.2rem}
.formerr{color:var(--late-fg);font-weight:600;margin:0 0 10px;min-height:1.2em}
.formact{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.formact .spacer{margin-right:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 32px);padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:500}

.views{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:2px}
.views button{flex:none;display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.views button:hover{border-color:var(--ink-2)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.views .n{margin-left:8px;font:700 1.05rem var(--font-display);font-variant-numeric:tabular-nums}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--ink-2);flex:none}
.s-confeitaria{background:var(--s-conf)}
.s-padaria{background:var(--s-pad)}
.s-salgados{background:var(--s-sal)}
.items .sdot{margin-right:8px;vertical-align:middle;position:relative;top:-1px}
.pill.sec{display:inline-flex;align-items:center}
.otherline{margin-top:4px;font-size:.85rem;color:var(--ink-2)}
.linkbox{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:.88rem}
.linkbox .lt{display:block;font:600 .72rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.linkbox .lk{padding:1px 0}
.vrow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.vrow input{width:22px;height:22px;margin-top:2px;flex:none}
.vrow small{display:block;color:var(--ink-2)}
.vinc-empty{margin:0 0 10px;color:var(--ink-2);font-size:.9rem}
@media (max-width:560px){
  h1{font-size:2rem}
  .ord{grid-template-columns:4rem minmax(0,1fr)}
  .act{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start}
  .act .btn{width:auto;flex:1 1 120px}
  .toolbar{align-items:stretch}
  #q{max-width:none}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#login form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#login h2{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:26px}
#login label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
#login input{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;background:var(--bg);color:var(--ink)}
#login .err{color:#b3261e;font-size:14px;min-height:18px}

/* ---- Pacote 1 ---- */
.gA{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,190px);gap:10px 12px;margin-bottom:10px}
.gB{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 12px;margin-bottom:14px}
details.vinc{margin:0 0 12px}
details.vinc>summary{cursor:pointer;color:var(--ink-2);font-size:.9rem;min-height:36px;display:flex;align-items:center}
.sync{margin-top:6px;font:500 .82rem var(--font-body);color:var(--ink-2)}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--done-fg)}
.sync.wait::before{background:var(--pend-fg)}
.sync.warn{color:var(--late-fg);font-weight:600}
.sync.warn::before{background:var(--late-fg)}
.cf-lead{margin:0 0 10px;color:var(--ink-2)}
.cf-box{border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.cf-id{font-size:1.1rem}
.cf-date{margin:6px 0 2px;font:700 1.7rem/1.1 var(--font-display)}
.cf-sub{color:var(--ink-2);font-size:.9rem}
.cf-warn{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--pend-bg);color:var(--pend-fg)}
.cf-warn ul{margin:4px 0 0;padding-left:18px}
.cf-by{max-width:260px;margin-bottom:12px}
body.tela{font-size:17px}
.tela #btn-new,.tela #btn-dl,.tela #btn-out,.tela [data-act=edit],.tela [data-act=conferir],.tela #q,.tela .pay{display:none!important}
.tela .ord{grid-template-columns:6rem minmax(0,1fr) auto}
.tela .ord .time{font-size:2.3rem}
.tela .who strong{font-size:1.4rem}
.tela .items b{font-size:1.4rem}
.tela .items li{font-size:1.1rem}
@media (max-width:640px){
  .gA{grid-template-columns:1fr 1fr}
  .gA .nm{grid-column:1 / -1}
  .irow{grid-template-columns:64px 66px minmax(0,1fr) 44px;grid-template-areas:"q u p p" "o o o rm" "s s s s"}
  .irow .i-q{grid-area:q}
  .irow .i-u{grid-area:u}
  .irow .i-p{grid-area:p}
  .irow .i-o{grid-area:o}
  .irow .i-s{grid-area:s;min-height:34px}
  .irow .rm{grid-area:rm}
  .irow.blank .i-s{display:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Supermercado Maravista · Padaria</div>
      <h1>Encomendas</h1>
      <div class="sync" id="sync" hidden></div>
    </div>
    <div class="top-act">
      <button class="btn" id="btn-dl" data-act="download" hidden>Imprimir folha do dia</button>
      <button class="btn" id="btn-out" hidden>Sair</button>
      <button class="btn btn-primary" id="btn-new" data-act="new">+ Nova encomenda</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="daynav">
    <button class="btn" data-act="prev" aria-label="Dia anterior">‹</button>
    <input type="date" id="date" aria-label="Data de entrega">
    <button class="btn" data-act="next" aria-label="Próximo dia">›</button>
    <button class="btn btn-ghost" data-act="today">Hoje</button>
    <span class="daylabel" id="daylabel"></span>
  </div>
  <div class="chips" id="chips" aria-label="Dias com encomendas"></div>
  <nav class="views" id="views" aria-label="Visão por setor"></nav>

  <section class="stats" id="stats" aria-label="Resumo do dia"></section>
  <div class="bar" aria-hidden="true"><i id="barfill"></i></div>

  <section class="prod" id="prod" aria-label="Totais por item"></section>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <input type="search" id="q" placeholder="Buscar por nome, telefone, nº ou item" aria-label="Buscar encomenda">
  </div>

  <main id="list"></main>
</div>

<datalist id="prods"></datalist>

<div class="ov" id="ov" hidden>
  <form class="sheet" id="form" autocomplete="off" novalidate>
    <h2 id="form-title">Nova encomenda</h2>
    <div class="gA">
      <label class="fld"><span>Nº do canhoto</span><input id="f-numero" inputmode="numeric" placeholder="4928"></label>
      <label class="fld nm"><span>Nome do cliente</span><input id="f-cliente"></label>
      <label class="fld"><span>Telefone com DDD</span><input id="f-tel" inputmode="tel" placeholder="(21) 99999-9999"></label>
    </div>
    <div class="gB">
      <label class="fld"><span>Data do pedido</span><input id="f-dped" type="date"></label>
      <label class="fld"><span>Data da entrega</span><input id="f-dent" type="date"></label>
      <label class="fld"><span>Hora da entrega</span><input id="f-hora" type="time" step="900"></label>
    </div>
    <fieldset>
      <legend>Itens da encomenda</legend>
      <div id="f-items"></div>
      <button type="button" class="btn btn-sm" data-act="additem">+ Adicionar linha</button>
    </fieldset>
    <div class="gB">
      <label class="fld"><span>Valor do sinal (R$)</span><input id="f-sinal" inputmode="decimal" placeholder="0,00"></label>
      <label class="fld"><span>Forma do sinal</span>
        <select id="f-forma"><option value="">—</option><option value="dinheiro">Dinheiro</option><option value="pix">Pix</option><option value="cartao">Cartão</option></select></label>
      <label class="fld"><span>Atendido por</span><input id="f-atend"></label>
    </div>
    <label class="fld" style="margin-bottom:10px"><span>Observações da encomenda</span><textarea id="f-obs"></textarea></label>
    <label class="fld" style="max-width:220px;margin-bottom:12px"><span>Valor total (opcional)</span><input id="f-total" inputmode="decimal" placeholder="0,00"></label>
    <details class="vinc" id="f-vinc">
      <summary>Mesmo cliente em outro canhoto?</summary>
      <div id="f-vinc-list"></div>
      <label class="fld"><span>Vincular por nº do canhoto (separe por vírgula)</span><input id="f-vinc-num" inputmode="numeric" placeholder="ex.: 4929, 4930"></label>
    </details>
    <p class="formerr" id="f-err" role="alert"></p>
    <div class="formact">
      <button type="button" class="btn btn-danger" id="f-del" data-act="del" hidden>Excluir</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-act="cancel">Cancelar</button>
      <button type="submit" class="btn btn-primary" id="f-save">Salvar</button>
    </div>
  </form>
</div>

<div class="ov" id="cf" hidden><div class="sheet" id="cf-sheet" role="dialog" aria-modal="true" aria-label="Conferência do pedido"></div></div>

<div id="login" hidden>
  <form id="login-form" autocomplete="on">
    <div class="eyebrow">Supermercado Maravista · Padaria</div>
    <h2>Entrar nas encomendas</h2>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseYmd=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var todayStr=function(){return ymd(new Date())};
var shiftDay=function(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
function fmtDay(s,long){
  var d=parseYmd(s);
  var w=d.toLocaleDateString('pt-BR',{weekday:long?'long':'short'}).replace('.','');
  return w+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+(long?'/'+d.getFullYear():'');
}
var brl=function(n){return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
var norm=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()};
var digits=function(s){return String(s||'').replace(/\D/g,'')};
function fmtPhone(s){
  var d=digits(s);
  if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
  if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
  if(d.length===9)return d.slice(0,5)+'-'+d.slice(5);
  if(d.length===8)return d.slice(0,4)+'-'+d.slice(4);
  return s||'';
}
function fmtQ(i){var n=Number(i.qtd);var t=isFinite(n)?String(Math.round(n*1000)/1000).replace('.',','):String(i.qtd||'');return t+(i.un==='kg'?' kg':'')}
function parseMoney(s){
  var t=String(s||'').replace(/[^\d,.-]/g,'').trim();
  if(!t)return null;
  if(t.indexOf(',')>-1)t=t.replace(/\./g,'').replace(',','.');
  var n=parseFloat(t);
  return isFinite(n)?Math.round(n*100)/100:NaN;
}
var FORMA={dinheiro:'Dinheiro',pix:'Pix',cartao:'Cartão'};
var STATUS_LABEL={pendente:'Pendente',pronto:'Pronto',entregue:'Entregue'};
var SETOR_KEYS=['confeitaria','padaria','salgados'];
var SETOR_LABEL={confeitaria:'Confeitaria',padaria:'Padaria',salgados:'Salgados fritos',sem:'Sem setor'};
var CATALOGO=[['Coxinha','salgados'],['Bolinha de queijo','salgados'],['Kibe','salgados'],['Risoles','salgados'],['Pastel frito','salgados'],['Croquete','salgados'],
  ['Empada','padaria'],['Pastel assado','padaria'],['Esfiha','padaria'],['Enroladinho de salsicha','padaria'],['Pão de queijo','padaria'],['Mini sanduíche','padaria'],['Torta salgada','padaria'],['Panetone','padaria'],
  ['Bolo','confeitaria'],['Torta doce','confeitaria'],['Rabanada','confeitaria'],['Brigadeiro','confeitaria'],['Beijinho','confeitaria'],['Docinhos','confeitaria']];
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,100)}
var DEFAULT_SETOR={};CATALOGO.forEach(function(p){DEFAULT_SETOR[slug(p[0])]=p[1]});
/* Ajustes rápidos: período do evento e limites dos avisos da conferência */
var LIM_UN=300,LIM_KG=30,HORA_MIN='06:00',HORA_MAX='22:00';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

var S={orders:[],loaded:false,date:todayStr(),filter:'abertas',q:'',busy:{},db:null,canWrite:true,editing:null,confirmDel:false,saving:false,now:new Date(),dl:null,errored:false,view:'geral',sfilter:'abertas',catDb:{},vincOff:{},conf:false,origem:'manual',forceConf:false,tela:false,online:(typeof navigator!=='undefined'?navigator.onLine!==false:true),fromCache:false,srvSeen:false,slow:false,pendingN:0};

/* Parâmetros do endereço: ?conferencia=1 liga a conferência (0 desliga); ?tela=producao e &setor=padaria */
(function(){
  var q=null;try{q=new URLSearchParams(location.search)}catch(e){}
  if(q){
    if(q.has('conferencia'))lsSet('conf',q.get('conferencia')==='0'?'0':'1');
    if(q.get('tela')==='producao'){S.tela=true;document.body.classList.add('tela')}
    var sv=q.get('setor');if(SETOR_KEYS.indexOf(sv)>-1)S.view=sv;
  }
  S.conf=lsGet('conf')==='1';
})();

/* ---------- regras de negócio ---------- */
function isLate(o){return o.status!=='entregue'&&timePassed(o)}
function timePassed(o){
  var t=todayStr();
  if(o.dataEntrega<t)return true;
  if(o.dataEntrega>t)return false;
  var p=String(o.horaEntrega||'00:00').split(':').map(Number);
  return S.now.getHours()*60+S.now.getMinutes()>p[0]*60+p[1];
}
function sortOrders(a,b){
  if(a.dataEntrega!==b.dataEntrega)return a.dataEntrega<b.dataEntrega?-1:1;
  if(a.horaEntrega!==b.horaEntrega)return String(a.horaEntrega)<String(b.horaEntrega)?-1:1;
  return (parseInt(a.numero,10)||0)-(parseInt(b.numero,10)||0);
}
function dayOrders(){return S.orders.filter(function(o){return o.dataEntrega===S.date}).sort(sortOrders)}
function matchesQuery(o){
  if(!S.q)return true;
  var q=norm(S.q),qd=digits(S.q);
  if(norm(o.cliente).indexOf(q)>-1)return true;
  if(norm(o.numero).indexOf(q)>-1)return true;
  if(qd&&digits(o.telefone).indexOf(qd)>-1)return true;
  return (o.itens||[]).some(function(i){return norm(i.produto).indexOf(q)>-1});
}
function totals(list,pred){
  var m={},order=[];
  list.forEach(function(o){(o.itens||[]).forEach(function(it){
    if(pred&&!pred(it))return;
    var k=norm(it.produto)+'|'+norm(it.obs)+'|'+(it.un==='kg'?'kg':'un');
    if(!m[k]){m[k]={produto:it.produto,obs:it.obs,un:it.un==='kg'?'kg':'un',qtd:0};order.push(k)}
    m[k].qtd=Math.round((m[k].qtd+(Number(it.qtd)||0))*1000)/1000;
  })});
  return order.map(function(k){return m[k]}).sort(function(a,b){return b.qtd-a.qtd});
}
function saldo(o){return (typeof o.total==='number')?Math.max(0,Math.round((o.total-(o.sinal||0))*100)/100):null}

/* ---------- render ---------- */
function renderDayBar(){
  $('#date').value=S.date;
  $('#daylabel').textContent=fmtDay(S.date,true);
  var by={};
  S.orders.forEach(function(o){var d=by[o.dataEntrega]||(by[o.dataEntrega]={n:0,open:0});d.n++;if(o.status!=='entregue')d.open++});
  var min=shiftDay(todayStr(),-7);
  var days=Object.keys(by).filter(function(d){return d>=min||d===S.date});
  if(!by[S.date]&&days.indexOf(S.date)<0)days.push(S.date);
  days.sort();
  var html=days.map(function(d){
    var x=by[d]||{n:0,open:0};
    return '<button class="chip" data-act="day" data-date="'+d+'" aria-pressed="'+(d===S.date)+'">'+esc(fmtDay(d))+
      ' <span class="n">'+x.n+'</span>'+(x.open?'<span class="dot" title="Há encomendas em aberto"></span>':'')+'</button>';
  }).join('');
  if(!html)html='<span class="chip-empty">Nenhum dia com encomendas ainda.</span>';
  $('#chips').innerHTML=html;
}
function renderStats(list){
  var c={pendente:0,pronto:0,entregue:0,late:0,receber:0,temTotal:false};
  list.forEach(function(o){
    c[effStatus(o)]++;
    if(isLate(o))c.late++;
    if(o.status!=='entregue'){var s=saldo(o);if(s!=null){c.receber+=s;c.temTotal=true}}
  });
  var tiles=[['Encomendas',list.length,''],['Pendentes',c.pendente,''],['Prontas',c.pronto,''],['Entregues',c.entregue,''],['Atrasadas',c.late,c.late?'late':'']];
  var html=tiles.map(function(t){return '<div class="stat '+t[2]+'"><b>'+t[1]+'</b><span>'+t[0]+'</span></div>'}).join('');
  var nc=list.filter(function(o){return o.conferido===false&&o.status!=='entregue'}).length;
  if(nc)html+='<div class="stat late"><b>'+nc+'</b><span>Sem conferir</span></div>';
  if(c.temTotal)html+='<div class="stat money"><b>'+esc(brl(c.receber))+'</b><span>Saldo a receber</span></div>';
  $('#stats').innerHTML=html;
  $('#barfill').style.width=(list.length?Math.round(c.entregue/list.length*100):0)+'%';
}
function renderProd(list){
  var open=list.filter(function(o){return o.status!=='entregue'});
  var t=totals(open);
  var h='<h2>Falta entregar · totais por item</h2>';
  if(!list.length)h+='<p>Sem encomendas neste dia.</p>';
  else if(!t.length)h+='<p>Tudo entregue neste dia.</p>';
  else h+='<ul>'+t.map(function(x){return '<li><b>'+esc(fmtQ(x))+'</b> '+esc(x.produto)+(x.obs?' <span class="obs">'+esc(x.obs)+'</span>':'')+'</li>'}).join('')+'</ul>';
  $('#prod').innerHTML=h;
}
function renderTabs(list){
  var a=list.filter(function(o){return o.status!=='entregue'}).length;
  var e=list.length-a;
  var defs=[['abertas','A entregar',a],['entregues','Entregues',e],['todas','Todas',list.length]];
  $('#tabs').innerHTML=defs.map(function(d){return '<button data-act="filter" data-f="'+d[0]+'" aria-pressed="'+(S.filter===d[0])+'">'+d[1]+' <span class="n">'+d[2]+'</span></button>'}).join('');
}
function payLine(o){
  var parts=[],s=saldo(o);
  if(o.sinal>0)parts.push('Sinal pago <strong>'+esc(brl(o.sinal))+'</strong>'+(o.formaSinal?' · '+FORMA[o.formaSinal]:'')+(o.caixa?' · caixa '+esc(o.caixa):''));
  else parts.push('Sem sinal registrado');
  if(o.status!=='entregue'){
    if(s!=null)parts.push(s>0?'Saldo a receber <strong>'+esc(brl(s))+'</strong>':'Quitado');
    else parts.push('<strong>Resta cobrar na retirada</strong>');
  }
  return parts.join(' · ');
}
function orderHTML(o){
  var st=effStatus(o),late=isLate(o),busy=S.busy[o.id]?' disabled':'';
  var pills='<span class="pill '+(st==='pendente'?'pend':st==='pronto'?'ready':'done')+'">'+STATUS_LABEL[st]+'</span>'+(late?'<span class="pill late">Atrasado</span>':'')+(o.conferido===false?'<span class="pill pend">Aguardando conferência</span>':'');
  var items=(o.itens||[]).map(function(i){var sk=itemSetor(i);return '<li><span class="sdot s-'+sk+'" title="'+SETOR_LABEL[sk]+'"></span><b>'+esc(fmtQ(i))+'</b> × '+esc(i.produto)+(i.obs?' <span class="obs">'+esc(i.obs)+'</span>':'')+'</li>'}).join('');
  var act='';
  if(S.canWrite){
    if(st==='pendente')act='<button class="btn" data-act="status" data-id="'+esc(o.id)+'" data-to="pronto"'+busy+'>Pronto</button><button class="btn btn-primary" data-act="status" data-id="'+esc(o.id)+'" data-to="entregue"'+busy+'>Entregue</button>';
    else if(st==='pronto')act='<button class="btn btn-primary" data-act="status" data-id="'+esc(o.id)+'" data-to="entregue"'+busy+'>Entregue</button><button class="linkbtn" data-act="status" data-id="'+esc(o.id)+'" data-to="pendente"'+busy+'>Voltar p/ pendente</button>';
    else act='<button class="btn btn-ghost btn-sm" data-act="status" data-id="'+esc(o.id)+'" data-to="pronto"'+busy+'>Desfazer entrega</button>';
    act+=(o.conferido===false?'<button class="btn btn-sm" data-act="conferir" data-id="'+esc(o.id)+'">Conferir</button>':'')+'<button class="linkbtn" data-act="edit" data-id="'+esc(o.id)+'">Editar</button>';
  }
  return '<article class="ord '+(st==='entregue'?'done ':'')+(late?'late':'')+'">'+
    '<div class="time">'+esc(o.horaEntrega||'--:--')+'</div>'+
    '<div class="main"><div class="who"><strong>'+esc(o.cliente)+'</strong>'+(o.numero?'<span class="num">Nº '+esc(o.numero)+'</span>':'')+'<span class="tel">'+esc(fmtPhone(o.telefone))+'</span></div>'+
    '<ul class="items">'+items+'</ul>'+(o.obs?'<div class="note">'+esc(o.obs)+'</div>':'')+
    '<div class="pay">'+payLine(o)+'</div><div class="pills">'+pills+secChips(o)+'</div>'+linkLine(o)+'</div>'+
    '<div class="act">'+act+'</div></article>';
}
function renderList(list){
  var el=$('#list');
  if(!S.loaded){el.innerHTML='<div class="empty"><b>Carregando encomendas…</b>Buscando os pedidos salvos.</div>';return}
  var shown=list.filter(function(o){
    if(S.filter==='abertas'&&o.status==='entregue')return false;
    if(S.filter==='entregues'&&o.status!=='entregue')return false;
    return matchesQuery(o);
  });
  if(!shown.length){
    var msg=!list.length?['Nenhuma encomenda para este dia','Use “Nova encomenda” para cadastrar o canhoto ou escolha outra data.']
      :S.q?['Nada encontrado','Nenhuma encomenda deste dia combina com a busca.']
      :S.filter==='abertas'?['Tudo entregue','Não há encomendas em aberto neste dia.']:['Nenhuma entrega registrada','Ainda não há encomendas marcadas como entregues.'];
    el.innerHTML='<div class="empty"><b>'+msg[0]+'</b>'+msg[1]+'</div>';
    return;
  }
  var groups={},keys=[];
  shown.forEach(function(o){var k=String(o.horaEntrega||'--').slice(0,2);if(!groups[k]){groups[k]=[];keys.push(k)}groups[k].push(o)});
  el.innerHTML=keys.map(function(k){
    var g=groups[k];
    return '<section class="slot"><h3 class="slot-h">'+(k==='--'?'Sem horário':k+'h')+' <small>'+g.length+(g.length===1?' encomenda':' encomendas')+'</small></h3><div class="slot-list">'+g.map(orderHTML).join('')+'</div></section>';
  }).join('');
}
function renderProdList(){
  var set={};CATALOGO.forEach(function(p){set[p[0]]=1});Object.keys(S.catDb).forEach(function(k){if(S.catDb[k].produto)set[S.catDb[k].produto]=1});
  S.orders.forEach(function(o){(o.itens||[]).forEach(function(i){if(i.produto)set[i.produto]=1})});
  $('#prods').innerHTML=Object.keys(set).sort().map(function(p){return '<option value="'+esc(p)+'">'}).join('');
}
function render(){
  var list=dayOrders(),sec=S.view!=='geral';
  renderDayBar();renderViews(list);
  if(sec){renderSectorStats(list);renderSectorProd(list);renderSectorTabs(list);renderSectorList(list)}
  else{renderStats(list);renderProd(list);renderTabs(list);renderList(list)}
  renderProdList();
  $('#btn-new').hidden=!S.canWrite||!S.db||S.tela;
  $('#btn-dl').textContent=sec?'Imprimir folha do setor':'Imprimir folha do dia';
  $('#btn-dl').hidden=S.tela||!S.dl||!(sec?sectorOrders(list,S.view).length:list.length);
  renderSync();
}
function renderSync(){
  var el=$('#sync');if(!el)return;
  if(!S.db){el.hidden=true;return}
  var off=!S.online||(S.srvSeen&&S.fromCache)||S.slow,n=S.pendingN,txt,cls='';
  if(n>0){
    if(off){txt='Sem conexão · '+n+(n===1?' alteração guardada':' alterações guardadas')+' neste aparelho; será'+(n===1?'':'ão')+' enviada'+(n===1?'':'s')+' quando a conexão voltar. Não feche esta página.';cls='warn'}
    else{txt='Enviando '+n+(n===1?' alteração…':' alterações…');cls='wait'}
  }else if(off&&S.loaded){txt='Sem conexão · mostrando os dados salvos neste aparelho';cls='warn'}
  else txt='Sincronizado';
  el.className='sync '+cls;el.textContent=txt;el.hidden=false;
}

/* ---------- setores ---------- */
function getSetor(produto){var k=slug(produto);return (S.catDb[k]&&S.catDb[k].setor)||DEFAULT_SETOR[k]||''}
function itemSetor(i){var s=i.setor||getSetor(i.produto);return SETOR_KEYS.indexOf(s)>-1?s:'sem'}
function sItems(o,s){return (o.itens||[]).filter(function(i){return itemSetor(i)===s})}
function sectorsOf(o){return SETOR_KEYS.filter(function(s){return sItems(o,s).length})}
function sectorOrders(list,s){return list.filter(function(o){return sItems(o,s).length})}
function sReady(o,s){return o.status==='entregue'||o.status==='pronto'||!!(o.pronto&&o.pronto[s])}
function effStatus(o){
  if(o.status==='entregue')return 'entregue';
  if(o.status==='pronto')return 'pronto';
  if(sItems(o,'sem').length)return 'pendente';
  var ss=sectorsOf(o);
  return ss.length&&ss.every(function(s){return sReady(o,s)})?'pronto':'pendente';
}
function secChips(o){
  var h=sectorsOf(o).map(function(s){var r=sReady(o,s);return '<span class="pill sec '+(r?'ready':'pend')+'"><span class="sdot s-'+s+'"></span>'+SETOR_LABEL[s]+(r?' ✓':'')+'</span>'}).join('');
  if(sItems(o,'sem').length)h+='<span class="pill pend">Item sem setor</span>';
  return h;
}
function catalogOps(itens,batch){
  var seen={};
  itens.forEach(function(i){
    var k=slug(i.produto);if(!k||seen[k]||!i.setor)return;seen[k]=1;
    var cur=(S.catDb[k]&&S.catDb[k].setor)||DEFAULT_SETOR[k];
    if(cur===i.setor)return;
    batch.set(S.db.doc('catalogo/'+k),{produto:i.produto,setor:i.setor});
  });
}
function renderViews(list){
  var defs=[['geral','Entrega',null]].concat(SETOR_KEYS.map(function(k){return [k,SETOR_LABEL[k],k]}));
  if(S.view==='sem'||list.some(function(o){return sItems(o,'sem').length}))defs.push(['sem','Sem setor','sem']);
  $('#views').innerHTML=defs.map(function(d){
    var n='';
    if(d[2])n=' <span class="n" title="A produzir">'+sectorOrders(list,d[2]).filter(function(o){return o.status!=='entregue'&&!sReady(o,d[2])}).length+'</span>';
    var dot=d[2]&&d[2]!=='sem'?'<span class="sdot s-'+d[2]+'"></span>':'';
    return '<button data-act="view" data-v="'+d[0]+'" aria-pressed="'+(S.view===d[0])+'">'+dot+d[1]+n+'</button>';
  }).join('');
}
function renderSectorStats(list){
  var s=S.view,ol=sectorOrders(list,s),a=0,p=0,e=0,late=0;
  ol.forEach(function(o){
    if(o.status==='entregue')e++;
    else if(sReady(o,s))p++;
    else{a++;if(timePassed(o))late++}
  });
  var tiles=[['Encomendas',ol.length,''],['A produzir',a,''],['Prontas',p,''],['Entregues',e,''],['Atrasadas',late,late?'late':'']];
  $('#stats').innerHTML=tiles.map(function(t){return '<div class="stat '+t[2]+'"><b>'+t[1]+'</b><span>'+t[0]+'</span></div>'}).join('');
  $('#barfill').style.width=(ol.length?Math.round((p+e)/ol.length*100):0)+'%';
}
function renderSectorProd(list){
  var s=S.view,ol=sectorOrders(list,s);
  var todo=ol.filter(function(o){return o.status!=='entregue'&&!sReady(o,s)});
  var t=totals(todo,function(i){return itemSetor(i)===s});
  var h='<h2>A produzir · '+SETOR_LABEL[s]+' · totais por item</h2>';
  if(!ol.length)h+='<p>Nenhuma encomenda deste setor neste dia.</p>';
  else if(!t.length)h+='<p>Tudo deste setor está pronto.</p>';
  else h+='<ul>'+t.map(function(x){return '<li><b>'+esc(fmtQ(x))+'</b> '+esc(x.produto)+(x.obs?' <span class="obs">'+esc(x.obs)+'</span>':'')+'</li>'}).join('')+'</ul>';
  $('#prod').innerHTML=h;
}
function renderSectorTabs(list){
  var s=S.view,ol=sectorOrders(list,s);
  var a=ol.filter(function(o){return o.status!=='entregue'&&!sReady(o,s)}).length;
  var defs=[['abertas','A produzir',a],['prontas','Prontas',ol.length-a],['todas','Todas',ol.length]];
  $('#tabs').innerHTML=defs.map(function(d){return '<button data-act="sfilter" data-f="'+d[0]+'" aria-pressed="'+(S.sfilter===d[0])+'">'+d[1]+' <span class="n">'+d[2]+'</span></button>'}).join('');
}
function sectorCardHTML(o,s){
  var done=o.status==='entregue',ready=sReady(o,s),late=!ready&&timePassed(o),busy=S.busy[o.id]?' disabled':'';
  var items=sItems(o,s).map(function(i){return '<li><b>'+esc(fmtQ(i))+'</b> × '+esc(i.produto)+(i.obs?' <span class="obs">'+esc(i.obs)+'</span>':'')+'</li>'}).join('');
  var others=sectorsOf(o).filter(function(k){return k!==s}).map(function(k){return SETOR_LABEL[k]+(sReady(o,k)?' ✓':'')});
  var pills='<span class="pill '+(done?'done':ready?'ready':'pend')+'">'+(done?'Entregue':ready?'Pronto':'A produzir')+'</span>'+(late?'<span class="pill late">Atrasado</span>':'');
  var act='';
  if(S.canWrite&&!done&&s!=='sem'){
    act=ready?'<button class="linkbtn" data-act="sector" data-id="'+esc(o.id)+'" data-s="'+s+'"'+busy+'>Desfazer</button>'
      :'<button class="btn btn-primary" data-act="sector" data-id="'+esc(o.id)+'" data-s="'+s+'"'+busy+'>Setor pronto</button>';
  }
  if(S.canWrite&&s==='sem')act='<button class="btn btn-primary" data-act="edit" data-id="'+esc(o.id)+'">Definir setor</button>';
  return '<article class="ord '+(ready||done?'done ':'')+(late?'late':'')+'">'+
    '<div class="time">'+esc(o.horaEntrega||'--:--')+'</div>'+
    '<div class="main"><div class="who"><strong>'+esc(o.cliente)+'</strong>'+(o.numero?'<span class="num">Nº '+esc(o.numero)+'</span>':'')+'</div>'+
    '<ul class="items">'+items+'</ul>'+(o.obs?'<div class="note">'+esc(o.obs)+'</div>':'')+
    (others.length?'<div class="otherline">Também em: '+esc(others.join(', '))+'</div>':'')+
    '<div class="pills">'+pills+'</div>'+linkLine(o)+'</div><div class="act">'+act+'</div></article>';
}
function renderSectorList(list){
  var el=$('#list'),s=S.view;
  if(!S.loaded){el.innerHTML='<div class="empty"><b>Carregando encomendas…</b>Buscando os pedidos salvos.</div>';return}
  var ol=sectorOrders(list,s);
  var shown=ol.filter(function(o){
    var r=o.status==='entregue'||sReady(o,s);
    if(S.sfilter==='abertas'&&r)return false;
    if(S.sfilter==='prontas'&&!r)return false;
    return matchesQuery(o);
  });
  if(!shown.length){
    var msg=!ol.length?['Nenhuma encomenda para '+SETOR_LABEL[s],'Os pedidos aparecem aqui quando algum item for deste setor.']
      :S.q?['Nada encontrado','Nenhuma encomenda deste setor combina com a busca.']
      :S.sfilter==='abertas'?['Setor em dia','Não há nada a produzir em '+SETOR_LABEL[s]+' neste dia.']:['Nada pronto ainda','Nenhuma encomenda deste setor foi marcada como pronta.'];
    el.innerHTML='<div class="empty"><b>'+esc(msg[0])+'</b>'+esc(msg[1])+'</div>';
    return;
  }
  var groups={},keys=[];
  shown.forEach(function(o){var k=String(o.horaEntrega||'--').slice(0,2);if(!groups[k]){groups[k]=[];keys.push(k)}groups[k].push(o)});
  el.innerHTML=keys.map(function(k){
    var g=groups[k];
    return '<section class="slot"><h3 class="slot-h">'+(k==='--'?'Sem horário':k+'h')+' <small>'+g.length+(g.length===1?' encomenda':' encomendas')+'</small></h3><div class="slot-list">'+g.map(function(o){return sectorCardHTML(o,s)}).join('')+'</div></section>';
  }).join('');
}
/* ---------- canhotos do mesmo cliente ---------- */
function linkedOf(o){
  if(!o.grupo)return [];
  return S.orders.filter(function(x){return x.grupo===o.grupo&&x.id!==o.id}).sort(sortOrders);
}
function secsText(x){return sectorsOf(x).map(function(s){return SETOR_LABEL[s]}).join(', ')||'sem setor'}
function linkText(o){
  return linkedOf(o).map(function(x){return 'Nº '+(x.numero||'s/n')+' ('+secsText(x)+', '+(x.horaEntrega||'--:--')+')'}).join(' · ');
}
function linkLine(o){
  var lk=linkedOf(o);if(!lk.length)return '';
  return '<div class="linkbox"><span class="lt">Mesmo cliente em outro canhoto</span>'+lk.map(function(x){
    var st=effStatus(x);
    var dia=x.dataEntrega!==o.dataEntrega?fmtDay(x.dataEntrega)+' · ':'';
    return '<div class="lk"><b>Nº '+esc(x.numero||'s/n')+'</b> · '+esc(secsText(x))+' · '+esc(dia+(x.horaEntrega||'--:--'))+' <span class="pill '+(st==='pendente'?'pend':st==='pronto'?'ready':'done')+'">'+STATUS_LABEL[st]+'</span></div>';
  }).join('')+'</div>';
}
function vincRow(o,kind,checked,why){
  return '<label class="vrow"><input type="checkbox" data-kind="'+kind+'" data-id="'+esc(o.id)+'"'+(checked?' checked':'')+'><span><b>Nº '+esc(o.numero||'s/n')+'</b> · '+esc(o.cliente)+' · '+esc(o.horaEntrega||'--:--')+' · '+esc(secsText(o))+'<small>'+why+'</small></span></label>';
}
function renderVincList(){
  var box=$('#f-vinc-list');if(!box)return;
  var selfId=S.editing?S.editing.id:null;
  var cur=S.editing?linkedOf(S.editing):[];
  var tel=digits($('#f-tel').value),dent=$('#f-dent').value,cand=[];
  if(tel.length>=8){
    var tail=tel.slice(-8);
    cand=S.orders.filter(function(o){
      return o.id!==selfId&&o.dataEntrega===dent&&digits(o.telefone).slice(-8)===tail&&!cur.some(function(c){return c.id===o.id});
    }).sort(sortOrders);
  }
  var h='';
  cur.forEach(function(o){h+=vincRow(o,'cur',!S.vincOff[o.id],'Já vinculado a este canhoto. Desmarque para desfazer.')});
  cand.forEach(function(o){h+=vincRow(o,'cand',!S.vincOff[o.id],'Mesmo telefone e mesmo dia de entrega. Desmarque se for outra pessoa.')});
  box.innerHTML=h||'<p class="vinc-empty">Nenhum outro canhoto deste cliente neste dia. Se houver, confira o telefone ou informe o nº abaixo.</p>';
  var det=$('#f-vinc');if(det&&(cur.length||cand.length))det.open=true;
}
function planLinks(selfId){
  var add=[],drop=[],missing=[];
  document.querySelectorAll('#f-vinc-list input[type=checkbox]').forEach(function(cb){
    if(cb.dataset.kind==='cand'&&cb.checked)add.push(cb.dataset.id);
    if(cb.dataset.kind==='cur'&&!cb.checked)drop.push(cb.dataset.id);
  });
  String($('#f-vinc-num').value||'').split(/[,;\s]+/).filter(Boolean).forEach(function(n){
    var m=S.orders.filter(function(o){return o.numero===n&&o.id!==selfId});
    if(!m.length)missing.push(n);
    m.forEach(function(o){if(add.indexOf(o.id)<0)add.push(o.id)});
  });
  return {add:add,drop:drop,missing:missing};
}
function planGid(plan,cur){
  var gid=(cur&&cur.grupo)||'';
  if(!gid)plan.add.forEach(function(id){var o=S.orders.filter(function(x){return x.id===id})[0];if(!gid&&o&&o.grupo)gid=o.grupo});
  if(!gid&&plan.add.length)gid='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  return gid;
}
function linkOps(plan,gid,batch){
  var ops=[];
  plan.add.forEach(function(id){
    var o=S.orders.filter(function(x){return x.id===id})[0];if(!o)return;
    if(o.grupo&&o.grupo!==gid)S.orders.forEach(function(x){if(x.grupo===o.grupo&&ops.indexOf(x.id)<0)ops.push(x.id)});
    if(o.grupo!==gid&&ops.indexOf(id)<0)ops.push(id);
  });
  ops.forEach(function(id){batch.update(S.db.doc('orders/'+id),{grupo:gid})});
  plan.drop.forEach(function(id){batch.update(S.db.doc('orders/'+id),{grupo:''})});
}
function toggleSector(id,s){
  var o=S.orders.filter(function(x){return x.id===id})[0];
  if(!o||!S.db||S.busy[id]||o.status==='entregue')return;
  var map={};sectorsOf(o).forEach(function(k){map[k]=sReady(o,k)});
  map[s]=!map[s];
  var data={pronto:map,statusAt:new Date().toISOString()};
  if(!map[s]&&o.status==='pronto')data.status='pendente';
  S.busy[id]=true;render();
  S.db.doc('orders/'+id).update(data).catch(function(){toast('Não foi possível enviar a alteração. Confira a conexão e tente de novo.')});
  setTimeout(function(){delete S.busy[id];render()},600);
}

var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},4000)}
function notice(msg){var n=$('#notice');if(msg){n.textContent=msg;n.hidden=false}else n.hidden=true}

/* ---------- gravação ---------- */
function setStatus(id,to){
  if(!S.db||S.busy[id])return;
  var o=S.orders.filter(function(x){return x.id===id})[0];
  var data={status:to,statusAt:new Date().toISOString()};
  if(o&&(to==='pronto'||to==='pendente')){var m={};sectorsOf(o).forEach(function(k){m[k]=(to==='pronto')});data.pronto=m}
  S.busy[id]=true;render();
  S.db.doc('orders/'+id).update(data).catch(function(){toast('Não foi possível enviar a alteração. Confira a conexão e tente de novo.')});
  setTimeout(function(){delete S.busy[id];render()},600);
}

/* ---------- formulário ---------- */
function markRow(r){
  var sel=r.querySelector('.i-s'),has=!!r.querySelector('.i-p').value.trim();

  sel.classList.toggle('needs',has&&!sel.value);

function addItemRow(q,p,o,s,u){
  var d=document.createElement('div');d.className='irow';
  d.innerHTML='<input class="i-q" inputmode="decimal" placeholder="Qtd" aria-label="Quantidade ou peso">'+
    '<select class="i-u" aria-label="Unidade"><option value="un">un</option><option value="kg">kg</option></select>'+
    '<input class="i-p" list="prods" placeholder="Produto" aria-label="Produto">'+
    '<input class="i-o obs" placeholder="Observação" aria-label="Observação do item">'+
    '<select class="i-s" aria-label="Setor do item"><option value="">Setor?</option><option value="confeitaria">Confeitaria</option><option value="padaria">Padaria</option><option value="salgados">Salgados fritos</option></select>'+
    '<button type="button" class="rm" data-act="rmitem" aria-label="Remover linha">×</button>';

function openForm(o,force){
  S.editing=o||null;S.confirmDel=false;S.forceConf=!!force;S.origem=(o&&o.origem)||'manual';
  $('#form-title').textContent=o?'Editar encomenda':'Nova encomenda';
  $('#f-numero').value=o?o.numero||'':'';
  $('#f-dped').value=o?o.dataPedido||'':todayStr();
  $('#f-cliente').value=o?o.cliente||'':'';

  $('#f-dent').value=o?o.dataEntrega:S.date;
  $('#f-hora').value=o?o.horaEntrega||'':'';
  $('#f-items').innerHTML='';
  var its=o&&o.itens&&o.itens.length?o.itens.slice():[];

  $('#f-sinal').value=o&&typeof o.sinal==='number'?String(o.sinal).replace('.',','):'';
  $('#f-forma').value=o?o.formaSinal||'':'';
  $('#f-atend').value=o?o.atendente||'':'';
  $('#f-obs').value=o?o.obs||'':'';
  S.vincOff={};$('#f-vinc-num').value='';$('#f-vinc').open=false;renderVincList();
  $('#f-err').textContent='';$('#f-err').dataset.dup='';
  $('#f-del').hidden=!o;$('#f-del').textContent='Excluir';

  $('#ov').hidden=false;
  setTimeout(function(){$('#f-numero').focus()},0);
}
function closeForm(){$('#ov').hidden=true;S.editing=null}
function collect(){
  var err=function(m){$('#f-err').textContent=m;return null};
  var cliente=$('#f-cliente').value.trim();
  if(!cliente)return err('Informe o nome do cliente.');
  var tel=digits($('#f-tel').value);
  if(tel.length<8)return err('Informe o telefone do cliente.');
  var dent=$('#f-dent').value;if(!dent)return err('Informe a data da entrega.');
  var hora=$('#f-hora').value;if(!hora)return err('Informe a hora da entrega.');
  var itens=[],bad=false;
  document.querySelectorAll('#f-items .irow').forEach(function(r){
    var q=r.querySelector('.i-q').value.trim(),p=r.querySelector('.i-p').value.trim(),ob=r.querySelector('.i-o').value.trim();
    if(!q&&!p&&!ob)return;
    var n=parseFloat(String(q).replace(',','.')),un=r.querySelector('.i-u').value==='kg'?'kg':'un';
    n=Math.round(n*1000)/1000;
    if(un==='un'&&n!==Math.floor(n))n=NaN;
    if(!p||!(n>0)){bad=true;return}
    var st=r.querySelector('.i-s').value||getSetor(p)||'';
    itens.push({qtd:n,un:un,produto:p,setor:st,obs:ob});
  });
  if(bad)return err('Cada item precisa de quantidade e produto. Em "un" use número inteiro; para peso escolha "kg".');
  if(!itens.length)return err('Adicione ao menos um item.');
  var total=parseMoney($('#f-total').value),sinal=parseMoney($('#f-sinal').value);
  if(total!==null&&isNaN(total))return err('Valor total inválido.');
  if(sinal!==null&&isNaN(sinal))return err('Valor do sinal inválido.');
  if(total!==null&&sinal!==null&&sinal>total)return err('O sinal não pode ser maior que o total.');
  var numero=$('#f-numero').value.trim();
  if(numero){
    var dup=S.orders.some(function(o){return o.numero===numero&&(!S.editing||o.id!==S.editing.id)});
    if(dup&&$('#f-err').dataset.dup!==numero){$('#f-err').dataset.dup=numero;return err('Já existe uma encomenda com o canhoto nº '+numero+'. Salve de novo para confirmar.')}
  }
  return {numero:numero,dataPedido:$('#f-dped').value||'',cliente:cliente,telefone:tel,dataEntrega:dent,horaEntrega:hora,itens:itens,
    total:total,sinal:sinal,formaSinal:$('#f-forma').value,atendente:$('#f-atend').value.trim(),obs:$('#f-obs').value.trim()};
}
function save(){
  if(!S.db)return;
  $('#f-err').textContent='';
  var data=collect();if(!data)return;
  var plan=planLinks(S.editing?S.editing.id:null);
  if(plan.missing.length){$('#f-err').textContent='Não encontrei o canhoto nº '+plan.missing.join(', ')+'. Cadastre-o antes ou tire da lista.';return}
  var gid=planGid(plan,S.editing);
  if(gid)data.grupo=gid;
  var need=(S.conf||S.origem==='foto'||S.forceConf)&&(!S.editing||S.editing.conferido===false||S.forceConf);
  if(need){showConference(data,plan,gid);return}
  commit(data,plan,gid,null);
}
/* Grava sem esperar o servidor: o pedido aparece na hora e o Firebase envia quando houver conexão. */
function commit(data,plan,gid,conf){
  var col=S.db.collection('orders'),now=new Date().toISOString();
  var ref=S.editing?col.doc(S.editing.id):col.doc();
  if(conf){data.conferido=!!conf.ok;data.conferidoPor=conf.by||'';data.conferidoEm=conf.ok?now:''}
  if(!S.editing){data.status='pendente';data.statusAt=now;data.criadoEm=now;data.origem=S.origem||'manual'}
  var batch=S.db.batch();
  if(S.editing)batch.update(ref,data);else batch.set(ref,data);
  catalogOps(data.itens,batch);
  linkOps(plan,gid,batch);
  batch.commit().catch(function(){toast('Não foi possível enviar o pedido nº '+(data.numero||'s/n')+' ao servidor. Confira se ele aparece na lista e tente de novo.')});
  S.date=data.dataEntrega;closeForm();closeConf();render();
  toast(gid&&plan.add.length?'Encomenda salva e vinculada.':'Encomenda salva.');
}
function del(){
  if(!S.editing||!S.db)return;
  if(!S.confirmDel){S.confirmDel=true;$('#f-del').textContent='Confirmar exclusão';return}
  S.db.doc('orders/'+S.editing.id).delete().catch(function(){toast('Não foi possível excluir. Tente de novo.')});
  closeForm();toast('Encomenda excluída.');
}

/* ---------- conferência ---------- */
var cfCtx=null;
function closeConf(){var c=$('#cf');if(c)c.hidden=true;cfCtx=null}
function warnings(d){
  var w=[],t=todayStr();
  if(d.dataPedido&&d.dataPedido>d.dataEntrega)w.push('A data do pedido é depois da data de entrega.');
  if(d.dataPedido&&d.dataPedido>t)w.push('A data do pedido está no futuro.');
  var n=digits(d.telefone).length;
  if(n<10)w.push('Telefone com '+n+' dígitos: falta o DDD?');else if(n>11)w.push('Telefone com dígitos demais ('+n+').');
  if(d.horaEntrega<HORA_MIN||d.horaEntrega>HORA_MAX)w.push('Hora de entrega fora do comum ('+d.horaEntrega+').');
  d.itens.forEach(function(i){
    if((i.un==='un'&&i.qtd>LIM_UN)||(i.un==='kg'&&i.qtd>LIM_KG))w.push('Quantidade alta: '+fmtQ(i)+' de '+i.produto+'. Confira.');
    if(!i.setor)w.push('“'+i.produto+'” ficará sem setor (dá para definir depois).');
  });
  if(d.numero&&S.orders.some(function(o){return o.numero===d.numero&&(!S.editing||o.id!==S.editing.id)}))w.push('Já existe outra encomenda com o canhoto nº '+d.numero+'.');
  return w;
}
function showConference(d,plan,gid){
  cfCtx={d:d,plan:plan,gid:gid};

  var items=d.itens.map(function(i){return '<li><b>'+esc(fmtQ(i))+'</b> × '+esc(i.produto)+(i.obs?' <span class="obs">('+esc(i.obs)+')</span>':'')+(i.setor?'':' <span class="pill pend">sem setor</span>')+'</li>'}).join('');

  $('#cf-sheet').innerHTML='<h2>Conferir com o papel</h2>'+
    '<p class="cf-lead">Leia o pedido junto com a atendente e compare com a comanda.</p>'+
    '<div class="cf-box">'+
      '<div class="cf-id"><b>Nº '+esc(d.numero||'s/n')+'</b> · '+esc(d.cliente)+' · '+esc(fmtPhone(d.telefone))+'</div>'+
      '<div class="cf-date">Entrega: '+esc(fmtDay(d.dataEntrega,true))+' às '+esc(d.horaEntrega)+'</div>'+
      (d.dataPedido?'<div class="cf-sub">Pedido feito em '+esc(fmtDay(d.dataPedido,true))+'</div>':'')+
      '<ul class="items">'+items+'</ul>'+
      '<div class="pay">'+pay+'</div>'+
      (d.atendente?'<div class="cf-sub">Atendido por '+esc(d.atendente)+'</div>':'')+
      (d.obs?'<div class="note">'+esc(d.obs)+'</div>':'')+
    '</div>'+
    (w.length?'<div class="cf-warn"><b>Confira com atenção:</b><ul>'+w.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>':'')+
    '<label class="fld cf-by"><span>Conferido por</span><input id="cf-by" placeholder="seu nome"></label>'+
    '<div class="formact"><button type="button" class="linkbtn spacer" data-act="cf-skip">Salvar sem conferir</button>'+
      '<button type="button" class="btn" data-act="cf-back">Voltar e corrigir</button>'+
      '<button type="button" class="btn btn-primary" id="cf-ok" data-act="cf-ok">Conferi, salvar</button></div>';
  $('#cf-by').value=lsGet('cfBy')||'';
  $('#cf').hidden=false;
  setTimeout(function(){var b=$('#cf-ok');if(b)b.focus()},0);
}
function confirmConference(ok){
  if(!cfCtx)return;
  var by=($('#cf-by').value||'').trim();
  if(ok&&by)lsSet('cfBy',by);

    '</style></head><body><h1>Encomendas da padaria · '+esc(fmtDay(date,true))+'</h1><p>Supermercado Maravista · '+list.length+' encomendas'+(t.length?' · Falta entregar: '+t.map(function(x){return fmtQ(x)+' '+esc(x.produto)+(x.obs?' ('+esc(x.obs)+')':'')}).join(', '):'')+'</p>'+

}
function sheetSetorHTML(date,list,s){
  var ol=sectorOrders(list,s);
  var t=totals(ol.filter(function(o){return o.status!=='entregue'&&!sReady(o,s)}),function(i){return itemSetor(i)===s});
  var rows=ol.map(function(o){
    var its=sItems(o,s).map(function(i){return '<div><b>'+esc(fmtQ(i))+'</b> × '+esc(i.produto)+(i.obs?' <i>('+esc(i.obs)+')</i>':'')+'</div>'}).join('');
    return '<tr><td class="h">'+esc(o.horaEntrega)+'</td><td>'+esc(o.numero)+'</td><td><b>'+esc(o.cliente)+'</b></td><td>'+its+'</td><td>'+esc((o.obs||'')+(linkedOf(o).length?' · Mesmo cliente: '+linkText(o):''))+'</td><td class="c"><span class="box">'+(sReady(o,s)?'✔':'')+'</span></td></tr>';
  }).join('');
  return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>'+esc(SETOR_LABEL[s])+' '+esc(date)+'</title><style>'+
    '@page{size:A4 landscape;margin:10mm}body{font:12px/1.35 Arial,sans-serif;color:#000;margin:0}h1{font-size:18px;margin:0 0 2px}p{margin:0 0 8px}'+
    'table{width:100%;border-collapse:collapse}th,td{border:1px solid #444;padding:5px 6px;text-align:left;vertical-align:top}th{background:#eee;font-size:11px;text-transform:uppercase}'+
    'tr{break-inside:avoid}.h{font-size:15px;font-weight:bold;white-space:nowrap}.c{text-align:center;width:60px}.box{display:inline-block;width:24px;height:24px;border:2px solid #000;line-height:22px;font-size:18px}'+
    '</style></head><body><h1>'+esc(SETOR_LABEL[s])+' · encomendas de '+esc(fmtDay(date,true))+'</h1><p>Supermercado Maravista · '+ol.length+' encomendas'+(t.length?' · A produzir: '+t.map(function(x){return fmtQ(x)+' '+esc(x.produto)+(x.obs?' ('+esc(x.obs)+')':'')}).join(', '):'')+'</p>'+
    '<table><thead><tr><th>Hora</th><th>Nº</th><th>Cliente</th><th>Itens do setor</th><th>Observações do pedido</th><th>Pronto</th></tr></thead><tbody>'+rows+'</tbody></table><script>window.addEventListener("load",function(){setTimeout(function(){window.print()},300)})<\/script></body></html>';
}
function printSheet(html,filename){
  var w=null;try{w=window.open('','_blank')}catch(e){}
  if(w&&w.document){w.document.open();w.document.write(html);w.document.close();return true}
  S.dl.save({filename:filename,data:html});
  return false;
}
function download(){
  var list=dayOrders(),sec=S.view!=='geral';
  if(!S.dl||!(sec?sectorOrders(list,S.view).length:list.length))return;
  var html=sec?sheetSetorHTML(S.date,list,S.view):sheetHTML(S.date,list);
  var fn='encomendas-'+S.date+(sec?'-'+S.view:'')+'.html';
  if(!printSheet(html,fn))toast('O navegador bloqueou a janela de impressão. A folha foi baixada: abra o arquivo para imprimir.');
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='prev'){S.date=shiftDay(S.date,-1);render()}
  else if(a==='next'){S.date=shiftDay(S.date,1);render()}
  else if(a==='today'){S.date=todayStr();render()}
  else if(a==='day'){S.date=b.dataset.date;render()}
  else if(a==='filter'){S.filter=b.dataset.f;render()}
  else if(a==='view'){S.view=b.dataset.v;render()}
  else if(a==='sfilter'){S.sfilter=b.dataset.f;render()}
  else if(a==='sector')toggleSector(b.dataset.id,b.dataset.s);
  else if(a==='status')setStatus(b.dataset.id,b.dataset.to);
  else if(a==='new')openForm(null);
  else if(a==='edit'){var o=S.orders.filter(function(x){return x.id===b.dataset.id})[0];if(o)openForm(o)}
  else if(a==='cancel')closeForm();
  else if(a==='additem')addItemRow();
  else if(a==='rmitem'){var r=b.closest('.irow');if(r)r.remove()}
  else if(a==='del')del();
  else if(a==='download')download();
  else if(a==='conferir'){var oc=S.orders.filter(function(x){return x.id===b.dataset.id})[0];if(oc)openForm(oc,true)}
  else if(a==='cf-ok')confirmConference(true);
  else if(a==='cf-skip')confirmConference(false);
  else if(a==='cf-back')closeConf();
});
$('#date').addEventListener('change',function(e){if(e.target.value){S.date=e.target.value;render()}});
$('#q').addEventListener('input',function(e){S.q=e.target.value;render()});
$('#form').addEventListener('submit',function(e){e.preventDefault();save()});
$('#f-tel').addEventListener('blur',function(e){e.target.value=fmtPhone(e.target.value)});
$('#f-items').addEventListener('input',function(e){
  var row=e.target.closest('.irow');if(!row)return;
  if(e.target.classList.contains('i-q')){
    var un=row.querySelector('.i-u');
    if(!un.dataset.manual&&/[.,]/.test(e.target.value))un.value='kg';
  }
  if(e.target.classList.contains('i-p')){
    var sel=row.querySelector('.i-s');
    if(!sel.dataset.manual)sel.value=getSetor(e.target.value)||'';
  }
  markRow(row);
});
$('#f-items').addEventListener('change',function(e){
  var row=e.target.closest('.irow');
  if(e.target.classList.contains('i-s')||e.target.classList.contains('i-u'))e.target.dataset.manual='1';
  if(row)markRow(row);
});
/* Enter passa para o próximo campo (Ctrl+Enter salva); no último campo, Enter salva. */
$('#form').addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.shiftKey)return;
  var t=e.target;
  if(e.ctrlKey||e.metaKey){e.preventDefault();save();return}
  if(t.tagName!=='INPUT'&&t.tagName!=='SELECT')return;
  e.preventDefault();
  var els=Array.prototype.filter.call($('#form').querySelectorAll('input,select,textarea'),function(x){
    if(x.disabled)return false;
    var det=x.closest('details');if(det&&!det.open)return false;
    if(x.classList.contains('i-s')&&(x.value||x.closest('.irow.blank')))return false;
    return true;
  });
  var i=els.indexOf(t);
  if(i>-1&&i<els.length-1)els[i+1].focus();
  else if(i===els.length-1)save();
});
window.addEventListener('online',function(){S.online=true;render()});
window.addEventListener('offline',function(){S.online=false;render()});
$('#f-tel').addEventListener('input',renderVincList);
$('#f-dent').addEventListener('change',renderVincList);
$('#f-vinc-list').addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.id)S.vincOff[t.dataset.id]=!t.checked});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(!$('#cf').hidden)closeConf();else if(!$('#ov').hidden)closeForm();
});
setInterval(function(){S.now=new Date();render()},60000);

render();
(function boot(){
  var cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/COLE_/.test(cfg.apiKey)){
    notice('Falta configurar o Firebase: preencha o arquivo firebase-config.js (veja o guia).');S.loaded=true;render();return}
  firebase.initializeApp(cfg);
  var auth=firebase.auth(),fs=firebase.firestore();
  /* Cache no aparelho: o painel abre mais rápido, usa menos leituras e guarda o que foi salvo sem internet. */
  try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
  S.dl={save:function(o){return new Promise(function(res){
    var blob=new Blob([o.data],{type:'text/html;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);res()})}};
  var unsubs=[],timer=null;
  function stop(){unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[];clearTimeout(timer);S.db=null;S.orders=[];S.loaded=false;S.catDb={};S.srvSeen=false;S.fromCache=false;S.slow=false;S.pendingN=0}
  function applyOrders(snap){
    var pend=0;
    S.orders=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;if(!x.status)x.status='pendente';if(d.metadata&&d.metadata.hasPendingWrites)pend++;return x}).filter(function(o){return o.dataEntrega});
    S.pendingN=pend;S.fromCache=!!(snap.metadata&&snap.metadata.fromCache);
    if(!S.fromCache){S.srvSeen=true;S.slow=false}
    S.loaded=true;render();
  }
  function pull(){
    fs.collection('orders').get({source:'server'}).then(function(snap){applyOrders(snap);clearTimeout(timer);notice('')},function(e){
      S.loaded=true;notice('Sem conexão com o servidor'+(e&&e.code?' ('+e.code+')':'')+'. Você pode continuar: o que for salvo fica neste aparelho e é enviado quando a conexão voltar.');render()});
  }
  function start(){
    S.db=fs;S.loaded=false;notice('');
    timer=setTimeout(function(){S.slow=true;notice('Ainda sem resposta do servidor. Tentando de novo…');pull();render()},8000);
    unsubs.push(fs.collection('catalogo').onSnapshot(function(snap){
      var m={};snap.docs.forEach(function(d){var x=d.data()||{};if(x.setor)m[d.id]={produto:x.produto||'',setor:x.setor}});
      S.catDb=m;render();
    },function(){}));
    unsubs.push(fs.collection('orders').onSnapshot({includeMetadataChanges:true},function(snap){
      applyOrders(snap);
      if(!snap.metadata.fromCache){clearTimeout(timer);notice('')}
    },function(e){clearTimeout(timer);S.loaded=true;S.errored=true;notice('Não foi possível ler as encomendas agora'+(e&&e.code?' ('+e.code+')':'')+'. Atualize a página.');render()}));
    render();
  }
  var MSG={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.','auth/network-request-failed':'Sem conexão com a internet.'};
  $('#login-form').addEventListener('submit',function(e){
    e.preventDefault();var b=$('#lg-btn');b.disabled=true;$('#lg-err').textContent='';
    auth.signInWithEmailAndPassword($('#lg-email').value.trim(),$('#lg-pass').value).catch(function(err){
      $('#lg-err').textContent=MSG[err.code]||('Não foi possível entrar ('+(err.code||'erro')+').')}).then(function(){b.disabled=false});
  });
  $('#btn-out').addEventListener('click',function(){auth.signOut()});
  auth.onAuthStateChanged(function(u){
    stop();
    if(u){$('#login').hidden=true;$('#btn-out').hidden=false;$('#lg-pass').value='';start()}
    else{$('#login').hidden=false;$('#btn-out').hidden=true;render()}
  });
  /* Tela de produção: mantém a tela acesa. */
  if(S.tela&&navigator.wakeLock){
    var wl=function(){try{navigator.wakeLock.request('screen').catch(function(){})}catch(e){}};
    wl();document.addEventListener('visibilitychange',function(){if(!document.hidden)wl()});
  }
})();
})();
</script>
